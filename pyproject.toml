[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dependency-fire-drill"
version = "0.1.0"
description = "Simulate supply chain attacks on your dependencies - see the blast radius before attackers do"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
keywords = ["security", "supply-chain", "dependencies", "devops", "ci-cd"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "docker>=7.0.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
    "packaging>=23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
fire-drill = "dependency_fire_drill.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/dependency-fire-drill"
Repository = "https://github.com/yourusername/dependency-fire-drill"
Issues = "https://github.com/yourusername/dependency-fire-drill/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/dependency_fire_drill"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "I", "N", "W"]
